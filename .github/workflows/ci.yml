name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check broker tests api.py
      # Includes two full trace replays that must give identical results.
      - run: python -m pytest -q
      - run: python -m broker.trace replay --trace data/01a_trace.csv --policy fair --seed 42 --out /tmp/replay >/dev/null
      - run: docker build -t job-broker:ci .
